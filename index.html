<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5th Monthsary ❤️</title>
    <style>
        :root { --primary: #ff477e; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            /* THE BACKGROUND PHOTO */
            background: #ffe5ec url('us.jpg') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden; 
            touch-action: manipulation; 
        }

        /* Subtle dark layer so white text/buttons pop */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 0;
        }
        
        /* Transparent Start Page */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center;
            align-items: center; z-index: 9999;
        }

        .container {
            /* HIGH TRANSPARENCY GLASS EFFECT */
            background: rgba(255, 255, 255, 0.25); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            
            padding: 30px; border-radius: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center; width: 85%; max-width: 300px;
            position: relative; z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1, h2 { color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        button { padding: 15px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; }
        
        .yes-btn { background: var(--primary); color: white; width: 100%; position: relative; box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4); }
        .yes-btn:active { transform: scale(0.95); }
        
        .no-btn { 
            background: rgba(255, 204, 213, 0.9); color: var(--primary); 
            position: fixed; width: 85px; z-index: 1000;
            display: none;
            transition: 0.1s ease-out;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 2px solid white;
        }

        .start-btn { 
            background: var(--primary); color: white; font-size: 18px; 
            padding: 20px 40px; border-radius: 50px; 
            box-shadow: 0 4px 20px rgba(255, 71, 126, 0.6); border: 2px solid rgba(255,255,255,0.4);
        }
        
        .surprise-btn {
            background: #ff4d4d; color: white; margin-top: 20px; width: 100%;
            display: block; text-decoration: none; line-height: 50px;
            border-radius: 12px; font-weight: bold; text-align: center;
        }

        .heart { position: absolute; color: #ff477e; font-size: 20px; pointer-events: none; animation: float 4s linear infinite; z-index: 5; }
        @keyframes float { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
        
        #stage-1, #stage-2, #final-screen { display: none; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop playsinline preload="auto">
        <source src="sumpa.mp3" type="audio/mpeg">
    </audio>

    <!-- Transparent Start Page -->
    <div id="overlay">
        <button class="start-btn" onclick="initApp()">Open Gift 🎁</button>
    </div>

    <div id="stage-1" style="justify-content: center; align-items: center; height: 100vh; display: none;">
        <div class="container" id="card-1">
            <h1 id="t1" style="font-size: 22px;">Happy monthsary baby</h1>
            <h2 id="t2" style="font-size: 16px; opacity: 0.9;">tum-oka na ang i love you pleaseee :(</h2>
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button class="yes-btn" onclick="goToStage2()">I love you baby</button>
                <div style="height: 50px;"></div> 
            </div>
        </div>
    </div>

    <div id="stage-2" style="justify-content: center; align-items: center; height: 100vh; display: none;">
        <div class="container" id="card-2">
            <h1 style="font-size: 28px;">Weh?</h1>
            <h2 style="font-size: 18px; opacity: 0.9;">Sure ka na?</h2>
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <button class="yes-btn" onclick="showFinal()">Yes baby</button>
                <div style="height: 50px;"></div> 
            </div>
        </div>
    </div>

    <div id="final-screen" style="justify-content: center; align-items: center; height: 100vh; display: none;">
        <div class="container">
            <h1 style="font-size: 24px;">I love you more baby</h1>
            <h2 style="font-size: 18px; opacity: 0.9;">happy 5th monthsary</h2>
            <a href="https://drive.google.com/file/d/1A6lXjb7Ir2BjkA4SNeUTk-2JavaCZZMO/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="surprise-btn">Open for surprise 🎁</a>
        </div>
    </div>

    <button class="no-btn" id="no-btn" onmouseover="moveBtn()" ontouchstart="moveBtn()" onclick="moveBtn()">No</button>

    <script>
        const messages = [
            ["Nde gani pwede!", "I love you dapat"], 
            ["Ihh baby :(", "Ma hibi ko"], 
            ["Ndi moko love?", "Ahayyyy"],
            ["Bawal No!", "Sige na baby..."]
        ];

        let currentCardId = 'card-1';
        const music = document.getElementById('bgMusic');

        function initApp() {
            music.play().catch(() => music.play());
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('stage-1').style.display = 'flex';
            document.getElementById('no-btn').style.display = 'block';
            setTimeout(resetNoButton, 100);
            setInterval(createHeart, 500);
        }

        document.addEventListener('touchstart', () => {
            if (music.paused) music.play();
        }, { once: true });

        function resetNoButton() {
            const btn = document.getElementById('no-btn');
            const card = document.getElementById(currentCardId).getBoundingClientRect();
            btn.style.left = (card.left + (card.width/2) - 42) + "px";
            btn.style.top = (card.bottom - 75) + "px";
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            heart.style.fontSize = (Math.random() * 20 + 10) + "px";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function moveBtn() {
            const btn = document.getElementById('no-btn');
            const card = document.getElementById(currentCardId).getBoundingClientRect();
            
            if(currentCardId === 'card-1') {
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                document.getElementById('t1').innerText = randomMsg[0];
                document.getElementById('t2').innerText = randomMsg[1];
            }
            
            const range = 220; 
            const x = (card.left + card.width/2) + (Math.random() * range * 2 - range) - 40;
            const y = (card.top + card.height/2) + (Math.random() * range * 2 - range) - 25;
            
            btn.style.left = Math.max(20, Math.min(window.innerWidth - 100, x)) + "px";
            btn.style.top = Math.max(20, Math.min(window.innerHeight - 80, y)) + "px";
        }

        function goToStage2() {
            document.getElementById('stage-1').style.display = 'none';
            document.getElementById('stage-2').style.display = 'flex';
            currentCardId = 'card-2';
            resetNoButton();
        }

        function showFinal() {
            document.getElementById('stage-2').style.display = 'none';
            document.getElementById('no-btn').style.display = 'none';
            document.getElementById('final-screen').style.display = 'flex';
        }
        
        window.onresize = resetNoButton;
    </script>
</body>
</html>
