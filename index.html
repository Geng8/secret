<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5th Monthsary ❤️</title>
    <style>
        :root { --primary: #ff477e; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #ffe5ec url('us.jpg') no-repeat center center fixed !important;
            background-size: cover !important;
            overflow: hidden; 
            touch-action: manipulation; 
        }

        /* Subtle dark overlay for contrast */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3); 
            z-index: 0;
        }

        /* Main floating layout */
        .content-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Text Styling with Outlines */
        h1, h2 { 
            color: white; 
            /* Creates a sharp black outline so it's readable on any photo */
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000,
                 0px  2px 10px rgba(0,0,0,0.5);
            margin: 10px 0;
        }

        h1 { font-size: 28px; }
        h2 { font-size: 18px; font-weight: normal; }

        /* Button Box Styling */
        button { 
            padding: 15px 30px; 
            border: 2px solid white; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        
        .yes-btn { 
            background: var(--primary); 
            color: white; 
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .no-btn { 
            background: rgba(255, 255, 255, 0.8); 
            color: var(--primary); 
            position: fixed; 
            width: 90px; 
            z-index: 1000;
            display: none;
            transition: 0.1s ease-out;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .start-btn { 
            background: var(--primary); 
            color: white; 
            font-size: 18px; 
            padding: 20px 40px; 
            border-radius: 50px; 
            border: 2px solid white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .surprise-btn {
            background: #ff4d4d; 
            color: white; 
            width: 250px;
            text-decoration: none; 
            line-height: 55px;
            border-radius: 15px; 
            font-weight: bold; 
            border: 2px solid white;
            display: block;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .heart { position: absolute; color: #ff477e; font-size: 20px; pointer-events: none; animation: float 4s linear infinite; z-index: 5; }
        @keyframes float { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
        
        #stage-1, #stage-2, #final-screen, #overlay { display: none; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop playsinline preload="auto">
        <source src="sumpa.mp3" type="audio/mpeg">
    </audio>

    <!-- Start Page -->
    <div id="overlay" class="content-wrapper" style="display: flex;">
        <button class="start-btn" onclick="initApp()">Open Gift 🎁</button>
    </div>

    <!-- Stage 1 -->
    <div id="stage-1" class="content-wrapper">
        <h1 id="t1">Happy monthsary baby</h1>
        <h2 id="t2">tum-oka na ang i love you pleaseee :(</h2>
        <div style="margin-top: 30px;">
            <button class="yes-btn" onclick="goToStage2()">I love you baby</button>
        </div>
    </div>

    <!-- Stage 2 -->
    <div id="stage-2" class="content-wrapper">
        <h1>Weh?</h1>
        <h2>Sure ka na?</h2>
        <div style="margin-top: 30px;">
            <button class="yes-btn" onclick="showFinal()">Yes baby</button>
        </div>
    </div>

    <!-- Final -->
    <div id="final-screen" class="content-wrapper">
        <h1>I love you more baby</h1>
        <h2>happy 5th monthsary</h2>
        <a href="https://drive.google.com/file/d/1A6lXjb7Ir2BjkA4SNeUTk-2JavaCZZMO/view?usp=drive_link" target="_blank" class="surprise-btn">Open for surprise 🎁</a>
    </div>

    <button class="no-btn" id="no-btn" onmouseover="moveBtn()" ontouchstart="moveBtn()" onclick="moveBtn()">No</button>

    <script>
        const messages = [["Nde gani pwede!", "I love you dapat"], ["Ihh baby :(", "Ma hibi ko"], ["Ndi moko love?", "Ahayyyy"], ["Bawal No!", "Sige na baby..."]];
        let currentStage = 'stage-1';
        const music = document.getElementById('bgMusic');

        function initApp() {
            music.play().catch(() => music.play());
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('stage-1').style.display = 'flex';
            document.getElementById('no-btn').style.display = 'block';
            setTimeout(resetNoButton, 100);
            setInterval(createHeart, 500);
        }

        document.addEventListener('touchstart', () => { if (music.paused) music.play(); }, { once: true });

        function resetNoButton() {
            const btn = document.getElementById('no-btn');
            // Center the button below the yes button area
            btn.style.left = (window.innerWidth / 2 - 45) + "px";
            btn.style.top = (window.innerHeight / 2 + 80) + "px";
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '100vh';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }

        function moveBtn() {
            const btn = document.getElementById('no-btn');
            if(currentStage === 'stage-1') {
                const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                document.getElementById('t1').innerText = randomMsg[0];
                document.getElementById('t2').innerText = randomMsg[1];
            }
            
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            btn.style.left = Math.max(10, x) + "px";
            btn.style.top = Math.max(10, y) + "px";
        }

        function goToStage2() { 
            document.getElementById('stage-1').style.display = 'none'; 
            document.getElementById('stage-2').style.display = 'flex'; 
            currentStage = 'stage-2';
            resetNoButton(); 
        }
        
        function showFinal() { 
            document.getElementById('stage-2').style.display = 'none'; 
            document.getElementById('no-btn').style.display = 'none'; 
            document.getElementById('final-screen').style.display = 'flex'; 
        }
        
        window.onresize = resetNoButton;
    </script>
</body>
</html>
